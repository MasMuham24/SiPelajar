<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Major</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-md p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Data Jurusan (Major)</h2>
            <button onclick="openModal('add')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition">
                + Tambah Jurusan
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200">
                        <th class="p-4 font-semibold text-gray-600">No</th>
                        <th class="p-4 font-semibold text-gray-600">Nama Jurusan</th>
                        <th class="p-4 font-semibold text-gray-600">Kode</th>
                        <th class="p-4 font-semibold text-gray-600">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="p-4 text-gray-800">1</td>
                        <td class="p-4 text-gray-800">Rekayasa Perangkat Lunak</td>
                        <td class="p-4 text-gray-800">RPL</td>
                        <td class="p-4">
                            <button onclick="openModal('edit')" class="text-yellow-500 hover:text-yellow-700 mr-3">Edit</button>
                            <button onclick="confirmDelete()" class="text-red-500 hover:text-red-700">Hapus</button>
                        </td>
                    </tr>
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="p-4 text-gray-800">2</td>
                        <td class="p-4 text-gray-800">Teknik Komputer dan Jaringan</td>
                        <td class="p-4 text-gray-800">TKJ</td>
                        <td class="p-4">
                            <button onclick="openModal('edit')" class="text-yellow-500 hover:text-yellow-700 mr-3">Edit</button>
                            <button onclick="confirmDelete()" class="text-red-500 hover:text-red-700">Hapus</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="crudModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
        <div class="bg-white rounded-lg w-full max-w-md p-6">
            <h3 id="modalTitle" class="text-xl font-bold mb-4">Tambah Jurusan</h3>
            <form id="majorForm" onsubmit="saveData(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nama Jurusan</label>
                    <input type="text" id="majorName" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Kode Jurusan</label>
                    <input type="text" id="majorCode" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="flex justify-end">
                    <button type="button" onclick="closeModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-md mr-2">Batal</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('crudModal');
        const modalTitle = document.getElementById('modalTitle');
        const form = document.getElementById('majorForm');

        function openModal(type) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            modalTitle.innerText = type === 'add' ? 'Tambah Jurusan' : 'Edit Jurusan';
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            form.reset();
        }

        function saveData(e) {
            e.preventDefault();
            closeModal();
            Swal.fire({
                icon: 'success',
                title: 'Berhasil!',
                text: 'Data jurusan berhasil disimpan.',
                timer: 1500,
                showConfirmButton: false
            });
        }

        function confirmDelete() {
            Swal.fire({
                title: 'Apakah Anda yakin?',
                text: "Data yang dihapus tidak dapat dikembalikan!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Ya, hapus!',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire('Terhapus!', 'Data jurusan telah dihapus.', 'success');
                }
            })
        }
    </script>
</body>
</html>
